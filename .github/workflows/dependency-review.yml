# Dependency Review - Analyzes dependency changes in PRs
# Checks for vulnerabilities and license compliance
#
# Features:
#   - Vulnerability detection in dependency changes
#   - License compliance checking
#   - Blocks PRs with high severity vulnerabilities
name: Dependency Review

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          # Deny copyleft and restrictive licenses (deny-list approach)
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, LGPL-2.0-only
          comment-summary-in-pr: on-failure
          # #CRITICAL: this is an accepted-risk allowlist, not a severity
          # downgrade. fail-on-severity stays at high and every other high or
          # critical advisory still blocks the PR. Only the ids listed here are
          # waived, and each one must have a dated entry in
          # docs/known-vulnerabilities.md.
          #
          # GHSA-8mgp-746c-j5xp: nltk model-artifact path traversal. #ASSUME:
          # no fixed release exists. The OSV record runs from introduced 0 to
          # last_affected 3.10.3 with no fixed event, and 3.10.3 is both the
          # pinned version and the newest release on PyPI, so no upgrade path
          # exists. nltk is dev-only, reaching the tree solely through safety
          # in the dev and supply-chain extras, so it never ships at runtime.
          # Without this entry every PR that touches uv.lock fails on an
          # advisory nobody can act on, Renovate updates included.
          # #VERIFY: drop this id the moment nltk ships a release above
          # 3.10.3; re-checked at each quarterly review, next 2026-11-02.
          # The same advisory is waived in osv-scanner.toml (GHSA alias) and
          # recorded in [tool.pip-audit].ignore-vuln (PYSEC alias).
          allow-ghsas: GHSA-8mgp-746c-j5xp
