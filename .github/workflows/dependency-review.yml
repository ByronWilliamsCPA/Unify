# Dependency Review - Analyzes dependency changes in PRs
# Checks for vulnerabilities and license compliance
#
# Features:
#   - Vulnerability detection in dependency changes
#   - License compliance checking
#   - Blocks PRs with high severity vulnerabilities
name: Dependency Review

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Deny copyleft and restrictive licenses (deny-list approach)
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, LGPL-2.0-only
          comment-summary-in-pr: on-failure
          # #CRITICAL: security: this is an accepted-risk allowlist, not a
          # severity downgrade. fail-on-severity stays at high and every other
          # high or critical advisory still blocks the PR. Only the ids listed
          # here are waived, and each one must have a dated entry in
          # docs/known-vulnerabilities.md.
          # #VERIFY: every id below has a matching dated entry in
          # docs/known-vulnerabilities.md; remove ids when their entry is
          # resolved.
          #
          # filelock 3.32.7 advisories (fixed only in 4.x; safety caps
          # filelock<4.0; present in dev, supply-chain and ml extras, not the default
          # runtime install). #VERIFY: drop when filelock>=4.2.1
          # resolves; reassess by 2026-11-30.
          allow-ghsas: GHSA-567q-5qvw-pf92, GHSA-6627-m3xw-93mp, GHSA-69hj-f68j-2879, GHSA-8mx5-7m5m-r77g, GHSA-9c4x-gm8v-wgc4, GHSA-9j6q-wvj5-jgjg, GHSA-9vhv-jxww-xfm5, GHSA-cwqr-hh33-gh44, GHSA-fq56-3cx3-fjxp, GHSA-j8f7-rjxc-mr56, GHSA-m462-7rxw-wvpg, GHSA-rfpc-qcw5-3pc4, GHSA-v4x8-3wr5-3wq8
