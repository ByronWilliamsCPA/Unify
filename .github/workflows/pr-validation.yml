# PR Validation for Foundry Unify
# Supplementary pull request checks: dead code detection and documentation links.
#
# #CRITICAL: this workflow no longer calls the org-level python-ci.yml reusable.
# That call was a duplicate of ci.yml's `ci` job, which already runs it once per
# PR and gates on it via the "CI Gate" required check. Removing the duplicate
# here does not reduce enforcement: CI Gate remains the sole required context
# tied to the reusable's pass/fail.
# #VERIFY: after merging, confirm a PR run shows python-ci.yml executing exactly
# once (in the CI workflow) and that CI Gate still blocks on its failure.
name: PR Validation

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop

# Cancel in-progress runs for same PR
concurrency:
  # #ASSUME: concurrency: github.event.pull_request.number is null under
  # merge_group; fall back to github.ref (unique per merge-group ref) so a
  # merge-group build never collides with, or is cancelled by, a PR build's
  # group.
  # #VERIFY: confirm no cross-cancellation between a PR run and its
  # corresponding merge-group run after the first live merge-queue pass.
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ==========================================================================
  # Additional Checks (Template-Specific)
  # ==========================================================================

  # Dead Code Detection with Vulture
  dead-code:
    name: Dead Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: ".uv-cache"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run vulture
        run: |
          echo "## Dead Code Report" >> $GITHUB_STEP_SUMMARY
          uv run vulture src/ --min-confidence 90 | tee vulture-report.txt || true
          if [ -s vulture-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat vulture-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::warning::Potential dead code detected. Review vulture report."
          else
            echo "✅ No dead code detected with 90% confidence." >> $GITHUB_STEP_SUMMARY
          fi

  # Documentation Link Check
  link-check:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,301,302,403,429
            --exclude '^https://github.com/.*/(issues|pulls|compare)/.*$'
            --exclude '^https://linear.app/.*$'
            './docs/**/*.md'
            './README.md'
            './CONTRIBUTING.md'
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================================
  # Validation Summary
  # ==========================================================================
  validate-dependencies:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    needs: [dead-code, link-check]
    if: always()
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check validation results
        run: |
          echo "## Dependency & Standards Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.dead-code.result }}" == "success" ]; then
            echo "✅ Dead Code Check: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Dead Code Check: ${{ needs.dead-code.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.link-check.result }}" == "success" ]; then
            echo "✅ Link Check: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Link Check: ${{ needs.link-check.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo ""
          echo "✅ All validation checks passed!" >> $GITHUB_STEP_SUMMARY
