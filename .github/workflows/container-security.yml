# Container Security Scanning for Foundry Unify
# Scans Docker images for vulnerabilities using Trivy and lints Dockerfile with Hadolint.
#
# This is a thin caller to the org-level reusable workflow.
name: Container Security

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Weekly scan on Wednesdays at 7 AM UTC
    - cron: '0 7 * * 3'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: container-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  container-security:
    name: Container Security Scan
    uses: ByronWilliamsCPA/.github/.github/workflows/python-container-security.yml@main
    with:
      dockerfile-path: 'Dockerfile'
      build-context: '.'
      image-tag: 'foundry_unify:scan'
      build-image: true
      severity-threshold: 'CRITICAL,HIGH'
      fail-on-vulnerabilities: true
      run-hadolint: true
      hadolint-failure-threshold: 'warning'
      generate-sbom: true
      # upload-sarif disabled: GitHub now bills Advanced Security (Code
      # Security), so github/codeql-action/upload-sarif no longer functions
      # on this repo. The reusable workflow already uploads the Trivy SARIF
      # unconditionally as part of the "container-security-reports"
      # artifact, so no replacement is needed for that scanner. Hadolint's
      # SARIF has no artifact fallback in the reusable workflow today (its
      # upload-sarif step was that scanner's only output); Hadolint findings
      # are not currently surfaced anywhere but the job log. Adding an
      # artifact fallback requires a change to python-container-security.yml
      # in ByronWilliamsCPA/.github, out of scope for this caller-only PR.
      # security-events: write is kept above because the callee jobs still
      # declare that permission structurally; GitHub validates the
      # caller-callee permission ceiling at parse time regardless of this
      # input's runtime value.
      upload-sarif: false
      artifact-retention-days: 90
    secrets: inherit
