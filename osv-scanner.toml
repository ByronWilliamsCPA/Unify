# OSV-Scanner Vulnerability Exceptions
# OpenSSF Scorecard uses OSV-Scanner to detect vulnerabilities
# This file documents false positives and vulnerabilities that don't affect this project
#
# Reference: https://google.github.io/osv-scanner/configuration/
# Format: [[IgnoredVulns]] with id and reason fields
#
# When to add exceptions:
# 1. Withdrawn vulnerabilities that are no longer valid
# 2. Vulnerabilities in old versions (current version is much newer and fixed)
# 3. Vulnerabilities that don't affect this project's codebase
# 4. False positives from vulnerability scanning tools
#
# IMPORTANT: Only add exceptions after careful analysis. Never ignore real vulnerabilities.
# Each exception MUST include:
# - id: CVE or advisory ID
# - reason: Detailed explanation of why this is safe to ignore

# ============================================================================
# Example: Withdrawn Vulnerability
# ============================================================================
# Uncomment and customize for your project:
#
# [[IgnoredVulns]]
# id = "CVE-XXXX-XXXXX"
# reason = "This CVE was withdrawn on YYYY-MM-DD due to [reason]. Not applicable to this project."

# ============================================================================
# Example: Fixed in Current Version
# ============================================================================
# Uncomment and customize for your project:
#
# [[IgnoredVulns]]
# id = "PYSEC-YYYY-NNN"
# reason = "Fixed in package-name >= X.Y.Z (released YYYY-MM-DD). Current version: X.Y.Z. Vulnerability does not apply."

# ============================================================================
# Example: Not Used in Project
# ============================================================================
# Uncomment and customize for your project:
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# reason = "Vulnerability affects [specific feature] which is not used in this project. Safe to ignore."

# ============================================================================
# Project-Specific Exceptions
# ============================================================================
# Add your project's vulnerability exceptions below this line

# The former interrogate/py entries (CVE-2022-42969, PYSEC-2022-42969,
# GHSA-w596-4wvx-j9j6) were removed on 2026-09-03: OSV withdrew that
# advisory on 2026-06-09, so nothing matched them any more and
# osv-scanner exited 1 with "has unused ignores".

# nltk: no fixed release exists. The OSV record for this advisory is
# {"introduced": "0"} to {"last_affected": "3.10.3"}, and 3.10.3 is both the
# version this lockfile pins and the newest release on PyPI, so there is
# nothing to upgrade to. nltk is not a runtime dependency of foundry-unify:
# it arrives only through safety, which is declared in the "dev" and
# "supply-chain" extras, so it never ships in a deployed environment.
# Tracked in docs/known-vulnerabilities.md; reassess by 2026-11-02.
# The matching pip-audit entry is [tool.pip-audit].ignore-vuln in
# pyproject.toml, which keys on the PYSEC alias of this same advisory.
[[IgnoredVulns]]
id = "GHSA-8mgp-746c-j5xp"
reason = "nltk 3.10.3 is the latest release and the advisory has no fixed version (last_affected 3.10.3). Dev-only transitive dependency via safety, never present at runtime. Accepted 2026-09-03, reassess by 2026-11-02. See docs/known-vulnerabilities.md."

# filelock 3.32.7: 13 advisories fixed only in 4.0.9 / 4.2.1. safety requires
# filelock<4.0, so the lock cannot upgrade. filelock arrives only through
# safety, python-discovery and virtualenv in the dev, supply-chain and ml
# extras, never in the runtime install. Accepted 2026-10-31, reassess by
# 2026-11-30. See docs/known-vulnerabilities.md.

[[IgnoredVulns]]
id = "GHSA-567q-5qvw-pf92"
reason = "filelock 3.32.7 fixed only in 4.x; safety caps filelock<4.0. Dev-only transitive dependency, absent at runtime. Accepted 2026-10-31, reassess by 2026-11-30. See docs/known-vulnerabilities.md."

