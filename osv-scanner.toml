reason = "filelock 3.32.7 fixed only in 4.x; safety caps filelock<4.0. Transitive dependency present in the dev, supply-chain and ml extras, absent from the default runtime install. Accepted 2026-10-31, reassess by 2026-11-30. See docs/known-vulnerabilities.md."

